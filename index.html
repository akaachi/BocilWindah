    <style>
        body{
    margin:0;

}

       .container{

        .menu-button {
            display: block;
            width: 100%;

            margin: 15px 0;
            border: none;
            border-radius: 15px;
            font-size: 18px;
            cursor: pointer;
            background-color: #32324a;
            color: white;
            transition: 0.2s;
        }

        .menu-button:hover {
            transform: scale(1.03);
            background-color: #46466b;
        }
        
        #memberArea{
    display:none;
}
    </style>
</head>

<body>

<script>

const supabaseUrl =
"https://xlrkxskyjjiatvoymylq.supabase.co";

const supabaseKey =
"eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inhscmt4c2t5amppYXR2b3lteWxxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODE1MTI3MDIsImV4cCI6MjA5NzA4ODcwMn0.39_bLrPf886g8Vc4zpYiauMQKqAiPoop4qnlMMm9HWI";

const client =
supabase.createClient(
    supabaseUrl,
    supabaseKey
);

async function loadPlayer(){
console.log(
    document.getElementById("userArea")
);
    const username =
        localStorage.getItem("username");
    const memberArea =
        document.getElementById("memberArea");
   if(!username){

    document.getElementById("userArea")
    .innerHTML = `
        <button class="menu-button">
            Login
        </button>
    `;

    return;
}

    const { data, error } = await client
        .from("players")
        .select("*")
        .eq("username", username)
        .limit(1);

    if(error || !data || data.length === 0){
        document.getElementById("userArea")
        .innerText = "Hi, Player! 👋";
        return;
    }

    const player = data[0];

memberArea.style.display = "block";

document.getElementById("userArea")
.innerHTML =
`Hi, ${player.display_name}! 👋`;
}

</script>

    <div class="container">

    <header>

        <h1>BocilWindah OA</h1>

            Loading...
        </div>

    </section>

</div>

<script>
loadPlayer();
</script>
