<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BocilWindah</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #1e1e2f;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            text-align: center;
        }

        .container {
            width: 90%;
            max-width: 500px;
        }

        h1 {
            margin-bottom: 5px;
        }

        p {
            color: #cccccc;
            margin-bottom: 40px;
        }

        .menu-button {
            display: block;
            width: 100%;
            padding: 18px;
            margin: 15px 0;
            border: none;
            border-radius: 15px;
            font-size: 18px;
            cursor: pointer;
            background-color: #32324a;
            color: white;
            transition: 0.2s;
        }

        .menu-button:hover {
            transform: scale(1.03);
            background-color: #46466b;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Hi, Bocil Windah! 👋</h1>
        <p>Ready to play? 🎮</p>

        <button class="menu-button" onclick="location.href='checkin.html'">
    📅 CHECK-IN
</button>
        <button class="menu-button">🎮 PLAY</button>
        <button class="menu-button">🏆 LEADERBOARD</button>
        <button class="menu-button">👤 MY ACCOUNT</button>
    </div>

</body>
</html>
