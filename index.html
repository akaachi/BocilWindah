<!DOCTYPE html>
<html lang="en">
<head>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BocilWindah</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #1e1e2f;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            text-align: center;
        }

        .container {
            width: 90%;
            max-width: 500px;
        }

        h1 {
            margin-bottom: 5px;
        }

        p {
            color: #cccccc;
            margin-bottom: 40px;
        }

        .menu-button {
            display: block;
            width: 100%;
            padding: 18px;
            margin: 15px 0;
            border: none;
            border-radius: 15px;
            font-size: 18px;
            cursor: pointer;
            background-color: #32324a;
            color: white;
            transition: 0.2s;
        }

        .menu-button:hover {
            transform: scale(1.03);
            background-color: #46466b;
        }
    </style>
</head>
<script>

const supabaseUrl =
"https://xlrkxskyjjiatvoymylq.supabase.co";

const supabaseKey =
"eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inhscmt4c2t5amppYXR2b3lteWxxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODE1MTI3MDIsImV4cCI6MjA5NzA4ODcwMn0.39_bLrPf886g8Vc4zpYiauMQKqAiPoop4qnlMMm9HWI";

const client =
supabase.createClient(
    supabaseUrl,
    supabaseKey
);

loadPlayer();

async function loadPlayer(){

    const username =
        localStorage.getItem("username");

    if(!username){
        document.getElementById("welcomeText")
        .innerText = "Hi, Guest! 👋";
        return;
    }

    const { data, error } = await client
        .from("players")
        .select("*")
        .eq("username", username)
        .limit(1);

    if(error || !data || data.length === 0){
        document.getElementById("welcomeText")
        .innerText = "Hi, Player! 👋";
        return;
    }

    const player = data[0];

    document.getElementById("welcomeText")
    .innerText =
    `Hi, ${player.display_name}! 👋`;
}

</script>
<body>

    <div class="container">
        <h1 id="welcomeText">Loading...</h1>
        <p>Ready to play? 🎮</p>

        <button class="menu-button" onclick="location.href='checkin.html'">
    📅 CHECK-IN
</button>
        <button class="menu-button">🎮 PLAY</button>
        <button class="menu-button">🏆 LEADERBOARD</button>
        <button class="menu-button">👤 MY ACCOUNT</button>
    </div>

</body>
</html>
