<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>BocilWindah OA</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    background:#1e1e2f;
    color:white;
    font-family:Arial,sans-serif;
}

.container{
    width:95%;
    max-width:1400px;
    margin:20px auto;
}

/* ====================
   TOP BAR
==================== */

.topBar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:20px;
}

.topBar h1{
    font-size:40px;
}

.weekBox{
    font-size:28px;
    font-weight:bold;
}

/* ====================
   LEADERBOARD ROW
==================== */

.leaderboardRow{
    display:flex;
    gap:20px;
    margin-bottom:20px;
}

.leaderboard{
    flex:1;
    height:120px;

    background:#32324a;
    border-radius:20px;

    display:flex;
    justify-content:center;
    align-items:center;

    font-size:32px;
}

.accountBox{
    width:180px;

    background:#32324a;
    border-radius:20px;

    display:flex;
    justify-content:center;
    align-items:center;

    cursor:pointer;
    font-weight:bold;
}

/* ====================
   TAB MENU
==================== */

.tabMenu{
    display:flex;
    gap:10px;
    margin-bottom:20px;
}

.tabButton{
    border:none;
    border-radius:15px;

    padding:14px 24px;

    background:#32324a;
    color:white;

    cursor:pointer;
    font-weight:bold;

    transition:0.2s;
}

.tabButton:hover{
    background:#46466b;
}

.activeTab{
    background:#5a5a88;
}

/* ====================
   MAIN LAYOUT
==================== */

.mainLayout{
    display:flex;
    gap:20px;
}

.contentArea{
    flex:1;

    min-height:500px;

    background:#32324a;
    border-radius:20px;

    padding:30px;
}

.ctInfo{
    width:280px;

    background:#32324a;
    border-radius:20px;

    padding:25px;
}

/* ====================
   DEMO CONTENT
==================== */

.sectionTitle{
    margin-bottom:20px;
}

.scheduleCard{
    background:#46466b;
    padding:20px;
    border-radius:15px;
    margin-bottom:15px;
}

</style>
</head>

<body>

<div class="container">

    <!-- HEADER -->

    <div class="topBar">

        <h1 id="welcomeText">
    Hi, Guest! 👋
</h1>

        <div class="weekBox">
            Week 1
        </div>

    </div>

    <!-- LEADERBOARD -->

    <div class="leaderboardRow">

        <div class="leaderboard">
            🏆 Leaderboard
        </div>

        <div class="accountBox" id="accountBox">
    My Account
</div>

    <!-- TABS -->

    <div class="tabMenu" id="tabMenu">

</div>

    <!-- MAIN CONTENT -->

    <div class="mainLayout">

        <div class="contentArea">

            <h2 class="sectionTitle">
                📅 Schedule
            </h2>

            <div class="scheduleCard">
                Mission Release - Monday
            </div>

            <div class="scheduleCard">
                Mini Game - Wednesday
            </div>

            <div class="scheduleCard">
                Weekly Recap - Sunday
            </div>

        </div>

        <div class="ctInfo">

            <h2>📢 CT Info</h2>

            <br>

            <p>
                Welcome to Week 1!
            </p>

            <br>

            <p>
                Next mission starts on Monday.
            </p>

            <br>

            <p>
                Check-in closes at 23:59.
            </p>

        </div>

    </div>

</div>
<script>

const username =
    localStorage.getItem("username");

const welcomeText =
    document.getElementById("welcomeText");

const tabMenu =
    document.getElementById("tabMenu");

if(username){

    welcomeText.innerText =
        `Hi, ${username}! 👋`;

    tabMenu.innerHTML = `
        <button class="tabButton activeTab">
            Home
        </button>

        <button class="tabButton">
            Rules
        </button>

        <button class="tabButton">
            Check-in
        </button>

        <button class="tabButton">
            Play
        </button>

        <button class="tabButton">
            Player Status
        </button>
    `;

}else{

    welcomeText.innerText =
        "Hi, Guest! 👋";

    tabMenu.innerHTML = `
        <button class="tabButton activeTab">
            Home
        </button>

        <button class="tabButton">
            Concept
        </button>

        <button class="tabButton">
            Rules
        </button>
    `;

}

</script>
</body>
</html>
