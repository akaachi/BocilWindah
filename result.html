<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Check Your Result</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>

<style>
body{
    background:#1e1e2f;
    color:white;
    font-family:Arial;
    text-align:center;
    padding:50px;
}

input{
    padding:12px;
    width:300px;
    border-radius:10px;
    border:none;
}

button{
    padding:12px 20px;
    border:none;
    border-radius:10px;
    cursor:pointer;
    margin-left:10px;
}

#result{
    margin-top:30px;
}
</style>

</head>
<body>

<h1>🔍 Check Your Result</h1>

<p>Enter your X Username</p>

<input
    id="username"
    placeholder="@username"
/>

<button onclick="searchResult()">
Search
</button>

<div id="result"></div>

<script>

const supabaseUrl =
"https://xlrkxskyjjiatvoymylq.supabase.co";
const supabaseKey = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inhscmt4c2t5amppYXR2b3lteWxxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODE1MTI3MDIsImV4cCI6MjA5NzA4ODcwMn0.39_bLrPf886g8Vc4zpYiauMQKqAiPoop4qnlMMm9HWI";

const client = supabase.createClient(
    supabaseUrl,
    supabaseKey
);

async function searchResult() {

    const username =
        document.getElementById("username")
        .value
        .trim();

    const resultBox =
        document.getElementById("result");

    const { data, error } = await client
        .from("applications")
        .select("*")
        .eq("username", username)
        .limit(1);

    if (error) {
        resultBox.innerHTML =
            "❌ Error loading data";
        return;
    }

    if (!data || data.length === 0) {
        resultBox.innerHTML =
            "🔍 Username not found.";
        return;
    }

    const player = data[0];

    if (player.status === "accepted") {

        resultBox.innerHTML = `
            <h2>🎉 Congratulations!</h2>
<p>You have been accepted into BocilWindah OA.</p>

<button onclick="window.location.href='claim.html?username=${player.username}'">
    Claim Your Slot
</button>
        `;

    } else if (player.status === "rejected") {

        resultBox.innerHTML = `
            <h2>💔 We're Sorry</h2>
            <p>You have not been accepted this time.</p>
        `;

    } else {

        resultBox.innerHTML = `
            <h2>⏳ Pending</h2>
            <p>Your application is still under review.</p>
        `;
    }
}
</script>
    
</body>
</html>
