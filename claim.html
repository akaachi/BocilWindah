<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Claim Your Slot</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>

<style>
body{
    background:#1e1e2f;
    color:white;
    font-family:Arial;
    text-align:center;
    padding:50px;
}

input{
    display:block;
    margin:10px auto;
    padding:12px;
    width:300px;
}

button{
    padding:12px 20px;
}
</style>
</head>

<body>

<h1>🎉 Claim Your Slot</h1>

<p id="usernameText"></p>

<p>
You've been accepted into BocilWindah OA.<br>
Create your account below to activate your player profile.
</p>

<p>X Username</p>

<input
    id="usernameField"
    readonly
>

<p>What would you like to be called?</p>
<p style="font-size:10px;">
(You can use your OC name, nickname, or any name you'd like other players to see.)
</p>
    
<input
    id="displayName"
    placeholder="OC name, nickname, etc."
>
    
  <input
    id="password"
    type="password"
    placeholder="Password">

<input
    id="confirmPassword"
    type="password"
    placeholder="Confirm Password">

<button onclick="claimAccount()">
    Activate Account
</button>

<div id="message"></div>

<script>

const supabaseUrl =
"https://xlrkxskyjjiatvoymylq.supabase.co";

const supabaseKey =
"eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inhscmt4c2t5amppYXR2b3lteWxxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODE1MTI3MDIsImV4cCI6MjA5NzA4ODcwMn0.39_bLrPf886g8Vc4zpYiauMQKqAiPoop4qnlMMm9HWI";

const client =
supabase.createClient(
    supabaseUrl,
    supabaseKey
);

const params =
new URLSearchParams(window.location.search);

const username =
params.get("username");

document.getElementById("usernameText")
.innerText = `Hi, ${username}! 👋`;

document.getElementById("usernameField")
.value = username;

async function claimAccount() {

    const displayName =
        document.getElementById("displayName").value;

    const password =
        document.getElementById("password").value;

    const confirmPassword =
        document.getElementById("confirmPassword").value;

    if(password !== confirmPassword){
        document.getElementById("message")
        .innerHTML = "Passwords do not match";
        return;
    }

    const { error } = await client
        .from("players")
        .update({
            display_name: displayName,
            password: password,
            account_claimed: true
        })
        .eq("username", username);

    if(error){
    console.log(error);

    document.getElementById("message")
    .innerHTML = error.message;

    return;
}

 document.getElementById("message")
.innerHTML =
"🎉 Account Activated! Redirecting to login...";

setTimeout(() => {
    window.location.href = "login.html";
}, 2000);

</script>

</body>
</html>
