<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Player Card</title>

<style>

body{
    background:#1e1e2f;
    color:white;
    font-family:Arial,sans-serif;

    display:flex;
    justify-content:center;

    padding:40px;
}

.playerCard{

    width:500px;

    background:#32324a;

    border-radius:25px;

    overflow:hidden;
}

.profileSection{

    padding:30px;

    text-align:center;
}

.avatar{

    width:150px;
    height:150px;

    border-radius:50%;

    background:#46466b;

    margin:auto;
    margin-bottom:20px;

    display:flex;
    justify-content:center;
    align-items:center;

    font-size:60px;
}

.playerName{

    font-size:32px;
    font-weight:bold;
}

.playerUsername{

    color:#cccccc;

    margin-top:5px;
}

.statsSection{

    padding:25px;

    border-top:1px solid rgba(255,255,255,0.15);
}

.statRow{

    display:flex;
    justify-content:space-between;

    padding:12px 0;
}

</style>
</head>
<div class="playerCard">

    <div class="profileSection">

        <div class="avatar">
            👤
        </div>

        <div class="playerName">
            Evan
        </div>

        <div class="playerUsername">
            @h_evva_nn
        </div>

    </div>

    <div class="statsSection">

        <div class="statRow">
            <span>⭐ Points</span>
            <span>125</span>
        </div>

        <div class="statRow">
            <span>📅 Check-In</span>
            <span>12</span>
        </div>

        <div class="statRow">
            <span>🎯 Missions</span>
            <span>8</span>
        </div>

        <div class="statRow">
            <span>⚠️ Violations</span>
            <span>1 / 3</span>
        </div>

        <div class="statRow">
            <span>🏷️ Status</span>
            <span>Active</span>
        </div>

    </div>

</div>

<body>
